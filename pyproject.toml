[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amigo-invisible"
version = "0.9.0"
description = "Sortea el Amigo Invisible y envía por correo un PDF navideño a cada participante."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["amigo invisible", "secret santa", "navidad", "pdf", "email"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
]
dependencies = [
    "reportlab>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "ruff>=0.5",
]

[project.scripts]
amigo-invisible = "amigo_invisible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amigo_invisible = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
